<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrace — Tesařství a pokrývačství Jakub Šuta</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ========================= PŘIHLÁŠENÍ ========================= -->
  <div class="login-screen" id="login-screen">
    <form class="login-card" id="login-form" autocomplete="off">
      <h1>Administrace webu</h1>
      <p class="sub">Tesařství a pokrývačství Jakub Šuta</p>

      <div class="login-error" id="login-error" role="alert"></div>

      <div class="field">
        <label for="login-password">Heslo</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password" minlength="1">
      </div>

      <button type="submit" class="btn btn-primary" id="login-submit">Přihlásit se</button>
    </form>
  </div>

  <!-- ========================= APLIKACE ========================= -->
  <div class="app" id="app">
    <div class="app-topbar">
      <div class="brand">Šuta <span>Admin</span></div>
      <div class="topbar-actions">
        <span class="save-status" id="save-status"></span>
        <a href="index.html" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Zobrazit web</a>
        <button class="btn btn-primary btn-sm" id="save-btn">Uložit změny</button>
        <button class="btn btn-danger btn-sm" id="logout-btn">Odhlásit</button>
      </div>
    </div>

    <div class="app-body">
      <div class="editor-pane">
        <div class="tabs">
          <button class="tab-btn is-active" data-tab="obsah">Obsah</button>
          <button class="tab-btn" data-tab="vzhled">Vzhled</button>
        </div>

        <div class="tab-panel is-active" id="tab-obsah" data-tab-panel="obsah"></div>
        <div class="tab-panel" id="tab-vzhled" data-tab-panel="vzhled"></div>
      </div>

      <div class="preview-pane">
        <iframe id="preview-frame" title="Živý náhled webu" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script src="js/image-editor.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
