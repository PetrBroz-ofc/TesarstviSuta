<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrace — Tesařství a pokrývačství Jakub Šuta</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ========================= PŘIHLÁŠENÍ ========================= -->
  <div class="login-screen" id="login-screen">
    <form class="login-card" id="login-form" autocomplete="off">
      <h1>Administrace webu</h1>
      <p class="sub">Tesařství a pokrývačství Jakub Šuta</p>

      <div class="login-error" id="login-error" role="alert"></div>

      <div class="field">
        <label for="login-password">Heslo</label>
        <div class="password-field">
          <input type="password" id="login-password" name="password" required autocomplete="current-password" minlength="1">
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Zobrazit heslo" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19.5C5 19.5 1.5 12 1.5 12a20.3 20.3 0 0 1 4.22-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4.5c7 0 10.5 7.5 10.5 7.5a20.29 20.29 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="login-submit">Přihlásit se</button>
    </form>
  </div>

  <!-- ========================= APLIKACE ========================= -->
  <div class="app" id="app">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="images/logo.png" alt="Tesařství a pokrývačství Jakub Šuta" class="sidebar-logo-img">
        <span class="brand-sub">/ admin</span>
      </div>

      <div class="sidebar-nav" id="section-nav"></div>

      <div class="sidebar-footer">
        <a href="index.html" target="_blank" rel="noopener" class="sidebar-back-btn">Zpět na web ↗</a>
        <button type="button" class="sidebar-logout" id="logout-btn">Odhlásit se</button>
      </div>
    </nav>

    <div class="app-main">
      <div class="app-topbar">
        <span class="save-status" id="save-status"></span>
        <div class="topbar-actions">
          <button type="button" class="btn btn-discard" id="discard-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            Zahodit změny
          </button>
          <button type="button" class="btn btn-publish" id="save-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            Publikovat
          </button>
        </div>
      </div>
      <div class="editor-pane" id="editor-pane"></div>
    </div>
  </div>

  <script src="js/image-editor.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
